name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/dashboard
        env:
          # Public identifiers (not secrets): they turn on the pilot sign-in box.
          # From the SageStack outputs PilotUserPoolClientId.
          VITE_COGNITO_REGION: ap-south-1
          VITE_COGNITO_CLIENT_ID: 5e0mg5u93tp1qrg8mb7hqs1qvc
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

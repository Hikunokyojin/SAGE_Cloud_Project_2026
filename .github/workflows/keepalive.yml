name: Keep demo warm

# Free MongoDB Atlas and Qdrant Cloud clusters go dormant after a period of no use.
# One small request a week keeps them alive while the backend is running. If the
# backend is paused the ping is skipped and the workflow still succeeds.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API: https://hiz4sheyl5.execute-api.ap-south-1.amazonaws.com/prod
    steps:
      - name: Ping the backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$API/health" || true)
          echo "health: $code"
          if [ "$code" = "200" ]; then
            curl -s -m 90 -X POST "$API/request" \
              -H "Content-Type: application/json" \
              -d '{"text":"I need an image resizing service under 0.05 dollars"}' | head -c 300
            echo
          else
            echo "Backend not answering (paused?); nothing to keep warm."
          fi

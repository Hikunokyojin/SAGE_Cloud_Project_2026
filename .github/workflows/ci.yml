name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # onnxruntime-node otherwise downloads an optional GPU (CUDA) build from GitHub on
          # install; SAGE runs on CPU only, and that download failing (504) broke CI once.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run typecheck
      - run: npm test
